<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Blog preview card</title>
</head>
<body>

 <main class="card-container">
  <article class="preview-card">
    <img class="card-hero" src="./assets/images/illustration-article.svg" alt="Abstract article cover illustration">
    
    <div class="card-content">
      <span class="badge">Learning</span>
      <time class="publish-date" datetime="2023-12-21">Published 21 Dec 2023</time>
      <h1 class="card-title"><a href="#">HTML & CSS foundations</a></h1>
      <p class="card-description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      
      <div class="card-author">
        <img class="avatar" src="./assets/images/image-avatar.webp" alt="Greg Hooper">
        <span class="author-name">Greg Hooper</span>
      </div>
    </div>
  </article>
</main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener">Frontend Mentor</a>. 
    Coded by <a href="#">Shehriyar Kabir</a>.
  </footer>
</body>
</html>
